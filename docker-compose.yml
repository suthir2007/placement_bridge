version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: placement_pilot_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: placement_pilot
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: placement_pilot_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=mysql+pymysql://user:userpassword@db:3306/placement_pilot
      - SECRET_KEY=placement-pilot-prod-secret
      - JWT_SECRET_KEY=jwt-secret-placement-pilot-key
      - FRONTEND_ORIGIN=http://localhost:5000
    depends_on:
      - db

volumes:
  db_data:
